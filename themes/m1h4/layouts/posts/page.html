{{ partial "header" . }}
<main id="main-content" class="main shell">
    <a class="back-link" href="{{ .Parent.RelPermalink }}">← {{ .Parent.LinkTitle }}</a>
    <article class="prose">
        <header class="page-header">
            <h1>{{ .Title }}</h1>
            <time class="label" datetime="{{ .Date.Format "2006-01-02" }}">{{ time.Format ":date_long" .Date }}</time>
        </header>
        {{ .Content }}
    </article>
</main>
{{ partial "footer" . }}
