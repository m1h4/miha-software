{{ partial "header" . }}
<main id="main-content" class="main shell">
    <header class="page-header"><h1>{{ .Title }}</h1></header>
    <section aria-labelledby="recent-heading">
        <h2 class="label" id="recent-heading">{{ T "recentPosts" }}</h2>
        {{ with .RegularPages }}
            {{ partial "post-list" . }}
        {{ else }}
            <p>{{ T "comingSoon" }}</p>
        {{ end }}
    </section>
    {{ with hugo.Sites.Default.GetPage "/posts/archive" }}
    <section aria-labelledby="archive-heading">
        <h2 class="label" id="archive-heading">{{ T "archive" }}</h2>
        <p><a href="{{ .RelPermalink }}" hreflang="{{ .Language.Name }}">{{ T "olderPosts" }} <span aria-hidden="true">→</span></a></p>
    </section>
    {{ end }}
</main>
{{ partial "footer" . }}
