{{ partial "header" . }}
<main id="main-content" class="main shell">
    <section aria-labelledby="apps-heading">
        <div class="section-heading"><h1 id="apps-heading" class="label">{{ T "currentApps" }}</h1><p class="label">{{ T "freePrivate" }}</p></div>
        <div class="app-grid">
        {{ range partial "current-products" .Site }}
            {{ partial "app-card" . }}
        {{ end }}
        </div>
    </section>
    <section aria-labelledby="archive-heading">
        <h2 id="archive-heading" class="label">{{ T "fromArchive" }}</h2>
        <p><a href="/apps/archive/">{{ T "olderApps" }} <span aria-hidden="true">→</span></a></p>
    </section>
</main>
{{ partial "footer" . }}
